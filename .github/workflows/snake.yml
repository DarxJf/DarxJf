name: Generate Snake Animation

on:
  # Se ejecuta automáticamente cada medianoche
  schedule:
    - cron: "0 0 * * *" 
  # Permite ejecutar la acción manualmente
  workflow_dispatch:
  # Se ejecuta cada vez que haces push a la rama principal
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      # Genera la animación en formato SVG
      - uses: Platane/snk/svg-only@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # Sube los archivos SVG generados a una rama llamada "output"
      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
